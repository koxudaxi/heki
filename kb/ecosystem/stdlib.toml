    { arg = 0, param = "host", numeric_address = true, effects = [] },
    { arg = 0, param = "host", one_of = ["localhost"], effects = [] },
    { arg = 5, param = "flags", flag = ["socket.AI_NUMERICHOST", "socket.AddressInfo.AI_NUMERICHOST"], effects = [] },
]
opaque_to_layer3 = true

