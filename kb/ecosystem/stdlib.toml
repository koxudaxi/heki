# --- What a call runs of the values it is handed (`[[invokes]]`) ---
# Each entry lists every argument the call runs code of: the special methods it runs on the
# argument's class (on the metaclass for a class object; "*" for any attribute, read by a name the
# call is handed), on the classes of the argument's items, and whether it calls the argument. An
# argument an entry does not list runs nothing there. A `lazy` call returns an iterator that runs
# the same code again while it is iterated. A key a dict or set looks up is compared with the keys it
# holds only on a hash collision, which an entry leaves out; the keys of a builtin dict or set it is
# handed come with their stored hashes. Under R3 a call of these runs code of the project only
# through what its entry lists, and a call of the catalog's other library functions only when it is
# handed a callable, an instance of a project class, or a value of a class heki does not know.

