# --- Blocking synchronization (waits on the calling thread) ---
# Acquiring a lock, waiting for an event, a condition, a barrier, a thread, a queue, or a
# future blocks until another thread acts (`blocking_sync`); a zero timeout or `blocking=False`
# / `block=False` / `wait=False` returns at once. `SimpleQueue.put` never blocks, and `put` on
# another queue waits only while the queue is full (`waits_while_full`): only one its
# `maxsize` bounds (`bounded_by`, a positive integer) can be.
# `Executor.submit` returns the `concurrent.futures.Future` to wait on; waiting on one known to be
# done (`waits_until_done`: under `if f.done():`, or once `await asyncio.wrap_future(f)`, which
# completes with `f` (`done_when_awaited`), has returned) returns at once.

[[entries]]
symbol = "threading.Lock.acquire"
effects = ["blocking_sync"]
cases = [
    { arg = 0, param = "blocking", equals = false, effects = [] },
    { arg = 1, param = "timeout", equals = 0, effects = [] },
]
opaque_to_layer3 = true

