sync_lock_or_tx = true
opaque_to_layer3 = true

[[entries]]
symbol = "threading.Condition"
sync_lock_or_tx = true
opaque_to_layer3 = true

# --- Offloads blocking work (argument index of the offloaded callable) ---

[[entries]]
symbol = "asyncio.to_thread"
