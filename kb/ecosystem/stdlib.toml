# --- DB (sqlite3) ---
# The `execute*` methods return the cursor. `fetch*` step the statement already executed: they
# read the database file (blocking) but send no new query, so a fetch loop is not `EFF103`.
# `commit()` and `rollback()` do nothing without an open transaction.

[[entries]]
symbol = "sqlite3.connect"
effects = ["blocking_db", "unpooled_client_alloc"]
# A connection waits on a file only when heki establishes that the argument names one (a
# literal or a constant without an in-memory form, or a path built from such parts); an
# in-memory database is opened without I/O, and its statements run without waiting. Any other
# argument (a parameter, an f-string, an environment lookup) may be in memory: such a
# connection, like one only an annotation names (`sqlite3.Connection`), may not wait.
return_type = "sqlite3.Connection"
emits = "if-on-disk"
cases = [
    { arg = 0, param = "database", one_of = [":memory:"], effects = ["unpooled_client_alloc"], return_type = 'sqlite3.connect(":memory:")' },
