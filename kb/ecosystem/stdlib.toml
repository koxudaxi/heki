# Layer 2: Ecosystem Effect / AsyncSafe / OffloadsBlocking / CopySanitizer Catalog
# Every package listed here (and every package an entry belongs to) is opaque_to_layer3: Layer 3 never
# descends into it (prevents A.7 false positive: asyncio.StreamWriter.write -> non-blocking socket.send).
# This file: the standard library (including `builtins`).

opaque_packages = [
    "builtins", "asyncio", "socket", "ssl", "subprocess", "time", "io", "os",
    "pathlib", "shutil", "sqlite3", "urllib", "http", "logging", "copy", "functools",
    "itertools", "collections", "threading", "multiprocessing", "concurrent",
]

# --- Sleep ---

[[entries]]
symbol = "time.sleep"
effects = ["sleep"]
opaque_to_layer3 = true

# --- Subprocess ---
# `subprocess.Popen` itself spawns without blocking and is deliberately NOT registered;
# only `.wait()` / `.communicate()` block (Stage 0-A finding).

[[entries]]
symbol = "subprocess.run"
effects = ["blocking_subprocess"]
opaque_to_layer3 = true

[[entries]]
symbol = "subprocess.call"
effects = ["blocking_subprocess"]
opaque_to_layer3 = true

[[entries]]
symbol = "subprocess.check_call"
effects = ["blocking_subprocess"]
opaque_to_layer3 = true

[[entries]]
symbol = "subprocess.check_output"
effects = ["blocking_subprocess"]
opaque_to_layer3 = true

[[entries]]
symbol = "subprocess.Popen.wait"
effects = ["blocking_subprocess"]
opaque_to_layer3 = true

[[entries]]
symbol = "subprocess.Popen.communicate"
effects = ["blocking_subprocess"]
opaque_to_layer3 = true

