# --- Synchronous locks (EFF106, opt-in) ---
# A `with` block over an instance holds the lock. The `asyncio` / `anyio` locks are async-safe
# and deliberately NOT registered.

[[entries]]
symbol = "threading.Lock"
sync_lock_or_tx = true
opaque_to_layer3 = true

[[entries]]
symbol = "threading.RLock"
sync_lock_or_tx = true
opaque_to_layer3 = true

[[entries]]
symbol = "threading.Semaphore"
