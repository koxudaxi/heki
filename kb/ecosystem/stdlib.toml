# --- Name resolution ---
# A host name lookup waits for the resolver (DNS); the event loop has `loop.getaddrinfo()`.
# A numeric address is parsed, not looked up, and `localhost` is answered by the hosts file or
# the resolver's own entry, without the network.

[[entries]]
