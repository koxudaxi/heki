# --- DB (sqlite3) ---
# The `execute*` methods return the cursor. `fetch*` step the statement already executed: they
# read the database file (blocking) but send no new query, so a fetch loop is not `EFF103`.

[[entries]]
symbol = "sqlite3.connect"
effects = ["blocking_db", "unpooled_client_alloc"]
return_type = "sqlite3.Connection"
opaque_to_layer3 = true

[[entries]]
symbol = "sqlite3.Connection.cursor"
return_type = "sqlite3.Cursor"
opaque_to_layer3 = true

[[entries]]
symbol = "sqlite3.Connection.execute"
effects = ["blocking_db", "db_query"]
return_type = "sqlite3.Cursor"
opaque_to_layer3 = true

