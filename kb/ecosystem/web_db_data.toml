# --- DB: psycopg (3) and psycopg_pool ---
# `psycopg.connect` is `Connection.connect`. `Connection.execute` returns a new cursor and
# `Cursor.execute` the cursor itself (awaited, for the async classes), so statements chain on
# their results. A client-side cursor receives the whole result in
# `execute`, so its `fetch*` methods do no I/O and are not listed. `cursor(name)` with a name
# returns a server-side cursor instead: `execute` declares it and each fetch (an iteration
# included) sends `FETCH`, blocking, though reading the rows of a declared statement is no new
# query. A pool's constructor starts
