# --- Document DB: motor (asyncio) ---
# Motor 3 wraps pymongo: every operation runs pymongo's in a thread pool and returns a future.
# The client connects in the background, `client[name]` / `get_database()` and
# `db[name]` / `get_collection()` only build objects, `find()` returns a lazy cursor whose
# builder methods return it again, and, unlike pymongo's `AsyncCollection.aggregate`,
# `aggregate()` returns a lazy command cursor: the query runs when the cursor is iterated
# (`async for`) or read (`to_list()`). The bulk writes (`insert_many`, `bulk_write`) send
# many documents at once: no `db_query`. Attribute access (`client.app.users`) is not typed.

