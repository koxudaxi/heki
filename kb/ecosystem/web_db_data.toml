# --- AWS: boto3 ---
# boto3 builds its client and resource classes at run time, so the instance class of
# `boto3.client(...)` is `boto3.client` itself and its operations are `boto3.client.<operation>`
# (likewise `boto3.resource.<Resource>.<action>`). Every listed operation is a network call;
# DynamoDB item reads and writes are database queries too (`query` / `scan` page through
