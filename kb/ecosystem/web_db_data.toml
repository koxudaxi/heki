# --- Document DB: pymongo (sync) ---
# `MongoClient(...)` returns at once and connects on background threads, but with
# `connect=True` (the default outside function-as-a-service platforms) a `mongodb+srv://` URI
# resolves its DNS records in the constructor; `connect=False` defers that to the first
# operation. `AsyncMongoClient` always defers it. `find()` returns a lazy cursor, whose
# builder methods (`sort`, `limit`, ...) return it again; iterating it (or `to_list()`) runs the
# query. `aggregate()` runs its command at the call. The bulk writes (`insert_many`,
# `bulk_write`) send many documents at once: no `db_query`.

[[entries]]
symbol = "pymongo.MongoClient"
effects = ["unpooled_client_alloc"]
cases = [
    { arg = 4, param = "connect", equals = false, effects = ["unpooled_client_alloc"] },
    { arg = 0, param = "host", prefix = ["mongodb+srv://"], effects = ["blocking_net", "unpooled_client_alloc"] },
]
exit_suppresses = false
opaque_to_layer3 = true

