[[entries]]
symbol = "asyncer.asyncify"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

# `database_sync_to_async = DatabaseSyncToAsync`, an `asgiref.sync.SyncToAsync(func,
