# Layer 2: Ecosystem Effect / AsyncSafe / OffloadsBlocking / CopySanitizer Catalog
# Every package listed here (and every package an entry belongs to) is opaque_to_layer3: Layer 3 never
# descends into it (prevents A.7 false positive: asyncio.StreamWriter.write -> non-blocking socket.send).
# This file: registered third-party packages (web / RPC / DB / data).
#
# Conventions (checked against the public API of each package):
# - An async API (a coroutine function, or a method returning an awaitable or an async context
#   manager) is `async_safe` and never carries a blocking effect: it is often called without a
#   direct `await` (`async with`, `asyncio.gather`, `asyncio.wait_for`), where the `is_awaited`
#   filter does not apply. Its loop-sensitive effects (`db_query`, `unpooled_client_alloc`) stay
#   for `EFF102` / `EFF103`.
# - A constructor or factory that does no I/O until the client is used (`redis.Redis`,
#   `pymongo.MongoClient`, `sqlalchemy.create_engine`) carries only `unpooled_client_alloc`; the
#   calls that do the I/O carry the blocking effects. Methods that only build an object
#   (`Redis.pipeline`, lazy `QuerySet.filter`, `Session.query`) carry no effect, only a
#   `return_type`. Iterating an object (`for row in query:`, a comprehension) runs its class's
#   `__iter__` entry, where the catalog has one (`sqlalchemy.orm.Query.__iter__`).
# - `db_query` marks one statement sent to the database and waited for (what `EFF103` counts).
#   Reading the rows of an executed statement is not a new query, nor is a driver's `commit()`;
#   an ORM `Session.commit()` / `flush()` sends the pending writes and is one.
# - Lookups are exact, without inheritance or aliases: an entry names the class that a factory's
#   `return_type`, an annotation, or a constructor call produces.

opaque_packages = [
    "requests", "httpx", "aiohttp", "urllib3", "sqlalchemy", "sqlmodel", "django", "psycopg",
    "psycopg_pool", "psycopg2", "pymysql", "redis", "pymongo", "boto3", "botocore", "grpc",
    "pandas", "numpy", "pydantic", "anyio", "trio", "starlette", "fastapi", "asgiref", "asyncer",
    "channels", "asyncpg", "websockets", "motor", "duckdb", "celery", "openai", "anthropic",
    "google", "polars", "torch",
]

# --- Offloads blocking work (argument index of the offloaded callable) ---
# An entry offloading argument 0 is also an offloading decorator: `@d def f` is `f = d(f)`, so
# calling `f` runs its body on another thread; a decorator factory with that entry
# (`@sync_to_async(thread_sensitive=False)`) is one too.
#
# `starlette.concurrency.iterate_in_threadpool(iterator)` (an async generator calling
# `next(iterator)` through `anyio.to_thread.run_sync`) needs no entry: an iterator passed to a
# function that is not a consuming call runs nothing where it is passed, and the argument is no
# callable, so `offloads_blocking_arg` would not describe it.

[[entries]]
symbol = "anyio.to_thread.run_sync"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

[[entries]]
symbol = "anyio.to_process.run_sync"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

[[entries]]
symbol = "anyio.to_interpreter.run_sync"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

[[entries]]
symbol = "trio.to_thread.run_sync"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

[[entries]]
symbol = "starlette.concurrency.run_in_threadpool"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

[[entries]]
symbol = "fastapi.concurrency.run_in_threadpool"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

# `sync_to_async(func=None, *, thread_sensitive=True, executor=None, context=None)`: returns
# `SyncToAsync(func, ...)`, whose call awaits `func` run in a thread pool; without `func` it
# returns that decorator (`@sync_to_async(thread_sensitive=False)`).
[[entries]]
symbol = "asgiref.sync.sync_to_async"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

# `asyncify(function, *, abandon_on_cancel=False, cancellable=None, limiter=None)`: an async
