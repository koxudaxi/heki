versions = "propcache 0.2.0, 0.3.0, 0.5.4"
keeps = "the C extension's non-data descriptor stores the getter's value in inst.__dict__[name] and returns it on later reads; the pure-Python fallback is functools.cached_property"
invalidation = "del obj.<name> and obj.__dict__.pop(<name>) remove the entry (no __delete__)"

[[cached_properties]]
symbol = "kombu.utils.objects.cached_property"
versions = "kombu 5.0.0, 5.3.0, 5.7.0"
keeps = "a data descriptor whose __get__ stores the getter's value in obj.__dict__[name] (from 5.3 through functools.cached_property.__get__) and returns it on later reads; __set__ stores into obj.__dict__"
