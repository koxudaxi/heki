# --- DB: asyncpg ---
# A connection runs one query at a time: a second task's query while another runs raises
# `InterfaceError: cannot perform operation: another operation is in progress` (`EFF110`).
# `connect()` opens a new connection on every call. `create_pool()` is a plain function
# returning the pool, which opens its connections when it is awaited or entered (`async with`);
# its query methods check a connection out for one statement each, so tasks may share it.
# `Pool.acquire()` returns a context manager that is also awaitable; both give a proxy
# forwarding to a pooled connection, typed here as the connection. `execute` / `fetch` /
# `fetchrow` / `fetchval` send one statement; `executemany` / `fetchmany` (from 0.30) and the
# `copy_*` methods send many rows at once (no `db_query`), and `prepare` only prepares one.
# `asyncpg.Connection` / `asyncpg.Pool` are re-exports of `asyncpg.connection.Connection` /
# `asyncpg.pool.Pool`; both spellings are listed.

