# --- Task queues: Celery ---
# `send_task()` publishes the task message to the broker and waits for the write (also under
# `task_always_eager`, which it ignores). `Task.delay()` / `apply_async()` publish it too,
# except under `task_always_eager` (a test setting), where they run the task in the caller.
# `AsyncResult.get()` is not listed: it returns at once for a result already fetched
# (`ready()` stores a finished one) or a task that ignores its result.

