[[entries]]
symbol = "channels.db.database_sync_to_async"
async_safe = true
offloads_blocking_arg = 0
opaque_to_layer3 = true

# --- Static files: Starlette ---
# `StaticFiles.lookup_path(path)` resolves the path under each directory (`os.path.realpath`)
# and stats it (`os.stat`). `get_response` runs it through `anyio.to_thread.run_sync`; a
# subclass calling it on the event loop blocks.

[[entries]]
symbol = "starlette.staticfiles.StaticFiles.lookup_path"
effects = ["blocking_fs"]
opaque_to_layer3 = true

# --- Copy sanitizers (MUT202) ---

[[entries]]
symbol = "pydantic.BaseModel.model_copy"
copy_sanitizer = "shallow"
opaque_to_layer3 = true

# `copy.deepcopy` of a model runs `BaseModel.__deepcopy__`, which deep-copies the instance's
# `__dict__` (its fields), its extra values, and its private attributes.
[[entries]]
symbol = "pydantic.BaseModel.__deepcopy__"
copy_sanitizer = "deep"
opaque_to_layer3 = true

# --- Models: pydantic ---
# Pydantic 2. Storing a field stores it in the instance's `__dict__` (validated first under
# `validate_assignment`); a private attribute goes to its `__pydantic_private__`, an extra one to
# its `__pydantic_extra__`; a frozen model, a class variable, and an unknown name without
# `extra="allow"` raise. Deleting works the same way. A field is no class attribute (no
# descriptor) and `BaseModel` defines no `__getattribute__` (its `__getattr__` only answers for
# private and extra attributes the instance lacks), so reading a field finds the stored value. A
# property or `cached_property` of the class is the project's own declaration.

[[entries]]
symbol = "pydantic.BaseModel.__setattr__"
stores_on_instance = true
opaque_to_layer3 = true

[[entries]]
symbol = "pydantic.BaseModel.__delattr__"
stores_on_instance = true
opaque_to_layer3 = true

# `pydantic-core` fills a field left out with the field's default: a hashable default (`None`, a
# string, an `object()` sentinel) is the default object itself, an unhashable one is deep-copied
# for each instance. A field that validates its default (`validate_default=True`, or the model's
# `validate_default` setting) holds what the validation returns instead.
[[entries]]
symbol = "pydantic.BaseModel"
keeps_hashable_defaults = true
opaque_to_layer3 = true

