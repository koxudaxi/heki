# --- DB transaction starters (EFF106, opt-in) ---
# A `with` block over the result of the call holds a transaction (and its pooled connection).
# `Connection.begin_nested()` sends `SAVEPOINT` at the call and `Session.begin_nested()` flushes
# the pending changes first, so both block; like a driver's `commit()`, transaction control is
# no `db_query`. `begin()` sends nothing until the first statement.

