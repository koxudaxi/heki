# --- Pure reads ---
# `builtins.str` / `builtins.bytes` carry NO return_exact_type: when `__str__` / `__bytes__` returns a
# str / bytes subclass, `str(x)` / `bytes(x)` return that subclass instance unchanged (CPython 3.11-3.15;
# witnessed by tests/sentinel/verify_soundness_kb.py).

