# Layer 1: Native Soundness KB (Soundness lane ONLY — ZERO advisory effect fields!)
# Allowed keys per entry: symbol, return_exact_type, param_effects, verified_max_python
# (enforced by `#[serde(deny_unknown_fields)]` in `heki_kb`).
# Verified by `tests/sentinel/verify_soundness_kb.py` against CPython 3.12-3.15.
# The Advisory lane reads `read_only` and `retained_in_return` too: the arguments a call only
# reads, for the parameters a function only reads (`EffectSummary::only_read_params`).
# Any entry with verified_max_python < target_python is auto-downgraded to Unknown.
# `param_effects[i]` describes positional parameter i; for methods, index 0 is `self`.

# --- Derived references (return value keeps a live view/iterator of the argument) ---
# `map` / `filter` keep their function too (`m.__reduce__()` hands it back).

[[entries]]
symbol = "builtins.iter"
param_effects = ["retained_in_return"]
verified_max_python = { major = 3, minor = 15 }

