# --- Reads of an iterable ---
# `sorted`, `any`, `all`, and `frozenset` take one positional argument. `sum` adds its `start`
# to each item, whose `__radd__` receives it and may keep it: `start` is `escaped`. `min` /
# `max` with two or more positional arguments compare each with the one found so far, whose
# `__lt__` / `__gt__` (or the reflected method of the other) receives it: every position is
# `escaped`.

[[entries]]
symbol = "builtins.sorted"
param_effects = ["read_only"]
verified_max_python = { major = 3, minor = 15 }

[[entries]]
symbol = "builtins.any"
param_effects = ["read_only"]
verified_max_python = { major = 3, minor = 15 }

[[entries]]
