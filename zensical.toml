[project]
site_name = "heki"
site_description = "Static checker for Python that tracks side effects and mutations across function calls."
site_url = "https://heki.koxudaxi.dev"
repo_name = "koxudaxi/heki"
repo_url = "https://github.com/koxudaxi/heki"
extra_css = ["stylesheets/heki.css"]

nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Getting Started" = "getting-started.md" },
  { "Features" = [
    { "State Ownership and Mutation" = "ownership.md" },
    { "Async and Execution Effects" = "effects.md" },
    { "Imports and Module Boundaries" = "imports.md" },
    { "Proven Rewrites (Performance)" = "fixes.md" },
    { "Configuration Advice" = "recommend.md" },
    { "Coding Agent Guardrails" = "coding-agents.md" },
  ]},
  { "Usage" = [
    { "Configuration & Contracts" = "configuration.md" },
    { "Adopting heki in a Code Base" = "adoption.md" },
    { "CLI Reference" = "cli-reference.md" },
    { "Output Formats" = "output-formats.md" },
  ]},
  { "Rules" = "rules/index.md" },
  { "Design Philosophy" = "philosophy.md" },
  { "Rule Precision" = "precision.md" },
  { "Scope and Limitations" = "scope.md" },
  { "Experimental Features" = "experimental.md" },
  { "Integrations" = [
    { "Editors (LSP)" = "lsp.md" },
  ]},
  { "Development" = "development.md" },
]

# Internal design docs: developer material kept in the repository, not part of the site.
exclude_docs = """
ANALYSIS_AND_KB_SPEC.md
DESIGN_HISTORY_AND_ADR.md
"""

[project.theme]
logo = "assets/heki-icon.png"
favicon = "assets/favicon.png"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.expand",
  "search.highlight",
  "search.share",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = "."

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.plugins.search]
