# The hook of `repo: https://github.com/koxudaxi/heki` in a project's `.pre-commit-config.yaml`.
# pre-commit installs this repository as a Python package: maturin builds `crates/heki` with
# cargo, as for the wheels on PyPI, and installs Rust into a cache directory first when cargo is
# missing. (`language: rust` runs `cargo install --path .`, which needs a package at the root of
# the workspace.) heki follows calls across files, so the hook analyzes the whole project and
# passes the files of the commit to `--touched`: it shows and fails on the reports in those files
# and the reports whose call chain reaches them, and on every regression of a baseline. A
# configuration file can change any report: the hook passes every TOML file, since a file the
# configuration includes may have any name, and every stub; naming a configuration file shows every report, and
# heki passes over the other TOML files. pre-commit appends the files after `args`, so
# `--touched` stays the last of `args`.
- id: heki
  name: heki
  description: Check side effects and mutations across function calls
  entry: heki check
  args: [--touched]
  language: python
  types_or: [python, pyi, toml]
  files: '\.(py|pyi|toml)$'
  pass_filenames: true
  require_serial: true
  # Warnings do not fail `heki check`, and pre-commit hides the output of a hook that passes.
  verbose: true
