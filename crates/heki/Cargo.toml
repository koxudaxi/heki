[package]
name = "heki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "heki"
path = "src/main.rs"

[features]
# Count the heap bytes heki asks for, for the memory gate (`scripts/check_memory.py`).
count-alloc = ["dep:cap", "dep:rayon"]

[dependencies]
anstyle-query.workspace = true
anyhow.workspace = true
cap = { workspace = true, optional = true }
clap.workspace = true
globset.workspace = true
heki_ast.workspace = true
heki_diagnostics.workspace = true
heki_effect.workspace = true
heki_env.workspace = true
heki_ir.workspace = true
heki_kb.workspace = true
heki_lsp.workspace = true
heki_profile.workspace = true
heki_rules.workspace = true
heki_semantic.workspace = true
heki_soundness.workspace = true
rayon = { workspace = true, optional = true }
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
proc-macro2.workspace = true
syn.workspace = true
url.workspace = true
