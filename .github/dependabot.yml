version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # AGENTS.md pins the ruff parser crates to one tag on purpose; Cargo.lock records the commit.
      - dependency-name: ruff_python_parser
      - dependency-name: ruff_python_ast
      - dependency-name: ruff_text_size
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      uv:
        patterns: ["*"]
