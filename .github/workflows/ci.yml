name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs every job on the release commit before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from release.yml, `github.workflow` is the caller's: a push to main does not cancel
  # a release's checks.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  UV_LOCKED: "1"

jobs:
  changes:
    name: changed files
    # A pull request that changes CHANGELOG.md alone builds and tests nothing: no job below reads
    # the file but the release scripts' tests, and the docs workflow builds the changelog page.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      # A pull request's checkout is its merge commit: the first parent is the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -qvxF CHANGELOG.md; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: rustfmt
      # Without `--locked` cargo rewrites an out-of-date Cargo.lock and goes on; this fails first.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    # A pull request in the middle of a stack is covered by the stack's bottom and top: GitHub
    # merges a stack from its top, and the bottom is the next one to land on main.
    needs: changes
    if: &full-run >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.stack == null
      || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  architecture:
    name: architecture invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - name: "ADR-004: heki_soundness never depends on heki_effect"
        run: |
          if cargo tree -p heki_soundness -e normal,build,dev | grep -q heki_effect; then
            echo "heki_soundness depends on heki_effect" >&2
            exit 1
          fi
      - name: "ADR-009 / ADR-016: ruff crates are used by heki_ast only"
        run: |
          for crate in ruff_python_parser ruff_python_ast ruff_text_size; do
            # The ruff crates depend on each other; only heki's own crates count as users.
            users="$(cargo tree -i "$crate" -e normal --depth 1 --prefix none | tail -n +2 | awk '{print $1}' | grep -v '^ruff_' | sort -u)"
            if [ "$users" != "heki_ast" ]; then
              echo "$crate is used by: $users" >&2
              exit 1
            fi
          done

  # The test binaries, built once per platform in the `ci` profile (optimized dependencies and
  # workspace crates, see Cargo.toml) and archived for that platform's `test` shards, which wait
  # for their own build only. Linux builds them from the unpacked source distribution, so its
  # shards run every test from it:
  # platforms without a wheel build from the source distribution, and packagers run its
  # tests, so it must carry every file the build and the tests embed or read (`pyproject.toml`).
  # The other platforms build the checkout.
  test-build-linux:
    name: build tests (${{ matrix.os }})
    needs: changes
    if: *full-run
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps: &test-build-steps
      - name: Allow long paths in git checkouts
        # The ruff crates come from a git tag (ADR-009 / ADR-016), and the ruff repository holds
        # test snapshots whose paths pass Windows' 260-character limit once cargo checks them out.
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Unpack the source distribution
        if: runner.os == 'Linux'
        run: &unpack-sdist |
          mkdir sdist-tree
          tar -xzf dist/*.tar.gz -C sdist-tree --strip-components 1
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The cache key of the three jobs; rust-cache adds the platform to it.
          shared-key: test-build-o1
          workspaces: ${{ runner.os == 'Linux' && 'sdist-tree -> target' || '. -> target' }}
      - &install-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          # install-action checks the download against the checksum it pins for this version.
          tool: cargo-nextest@0.9.152
      - name: Build and archive the tests
        shell: bash
        env:
          TREE: ${{ runner.os == 'Linux' && 'sdist-tree' || '.' }}
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        run: >-
          cargo nextest archive --workspace --locked --cargo-profile ci
          --manifest-path "$TREE/Cargo.toml" --archive-file tests.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: |
            tests.tar.zst
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test-build-macos:
    name: build tests (${{ matrix.os }})
    needs: changes
    if: *full-run
    strategy:
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps: *test-build-steps

  test-build-windows:
    name: build tests (${{ matrix.os }})
    needs: changes
    if: *full-run
    strategy:
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    steps: *test-build-steps

  # Each shard runs a fixed part of its platform's archived tests (`--partition count:k/n`: every
  # n-th test). The tests read the files of the tree they were built in (`CARGO_MANIFEST_DIR`)
  # and run `heki` from where it was built (`CARGO_BIN_EXE_heki`), so a shard checks out (or
  # unpacks) the same tree at the same path and extracts the binaries back into it.
  test-linux:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, test-build-linux]
    if: *full-run
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        shard: [1, 2, 3, 4]
        shards: [4]
    runs-on: ${{ matrix.os }}
    steps: &test-steps
      - if: runner.os != 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-${{ matrix.os }}
      - name: Unpack the source distribution
        if: runner.os == 'Linux'
        run: *unpack-sdist
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - *install-nextest
      # The `--fix` differential tests run the rewritten programs on real CPython.
      # `--no-fail-fast`: one run reports every failure of the shard.
      - name: Run the shard
        shell: bash
        env:
          HEKI_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          TREE: ${{ runner.os == 'Linux' && 'sdist-tree' || '.' }}
          PARTITION: count:${{ matrix.shard }}/${{ matrix.shards }}
        run: >-
          cargo nextest run --archive-file tests.tar.zst --extract-to "$TREE" --extract-overwrite
          --workspace-remap "$TREE" --partition "$PARTITION" --no-fail-fast

  test-macos:
    # The account runs at most 5 macOS jobs at once: the build, then these 4.
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, test-build-macos]
    if: *full-run
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        shard: [1, 2, 3, 4]
        shards: [4]
    runs-on: ${{ matrix.os }}
    steps: *test-steps

  test-windows:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, test-build-windows]
    if: *full-run
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        shard: [1, 2, 3, 4, 5]
        shards: [5]
    runs-on: ${{ matrix.os }}
    steps: *test-steps

  coverage-build:
    # The instrumented test binaries, in the `ci` profile. cargo-llvm-cov builds
    # into `coverage/target`, a directory named `target`, so the shards can extract the archive
    # back to the path the binaries were built at.
    name: build coverage tests
    needs: changes
    if: *full-run
    runs-on: ubuntu-24.04
    env:
      CARGO_LLVM_COV_TARGET_DIR: coverage/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage-o0
          workspaces: ". -> coverage/target"
      - &install-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.152
      - run: >-
          cargo llvm-cov nextest-archive --workspace --locked --cargo-profile ci-coverage
          --archive-file coverage-tests.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-tests
          path: coverage-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  coverage-test:
    # A shard of the instrumented tests, as in `test`. Every process writes its counters into
    # its own raw profile (cargo-llvm-cov's file pattern); the shard merges them into one.
    name: coverage tests (${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, coverage-build]
    if: *full-run
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shards: [8]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `llvm-profdata` of the toolchain the binaries were built with.
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: llvm-tools-preview
      - *install-nextest
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-tests
      - name: Run the shard
        env:
          HEKI_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          PARTITION: count:${{ matrix.shard }}/${{ matrix.shards }}
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage/target/heki-%p-%14m.profraw
        run: |
          mkdir -p coverage
          cargo nextest run --archive-file coverage-tests.tar.zst --extract-to coverage \
            --extract-overwrite --workspace-remap . --partition "$PARTITION" --no-fail-fast
      - name: Merge the shard's profiles
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          llvm_profdata="$(rustc --print target-libdir)/../bin/llvm-profdata"
          find coverage/target -maxdepth 1 -name '*.profraw' > profraw-list
          "$llvm_profdata" merge -sparse -f profraw-list -o "coverage-$SHARD.profdata"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-profile-${{ matrix.shard }}
          path: coverage-*.profdata
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage (100% lines)
    needs: [changes, coverage-test]
    if: *full-run
    runs-on: ubuntu-24.04
    env:
      CARGO_LLVM_COV_TARGET_DIR: coverage/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: llvm-tools-preview
      - *install-llvm-cov
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-profile-*
          path: profiles
          merge-multiple: true
      # The report reads the binaries where they were built, and merges every `*.profraw` of
      # its target directory with `llvm-profdata merge`, which also reads the shards' merged
      # (indexed) profiles.
      - name: Unpack the binaries and the shards' profiles
        run: |
          mkdir -p coverage
          tar --zstd -xf coverage-tests.tar.zst -C coverage
          for profile in profiles/*.profdata; do
            cp "$profile" "coverage/target/$(basename "$profile" .profdata).profraw"
          done
      # Every line is covered except 3 that cannot run: the `_ => {}` arms for assignment,
      # augmented-assignment and `del` targets in `heki_ir/src/builder.rs`, which ruff's parser
      # rejects (see `docs/development.md`). Lower the limit whenever one goes away.
      - run: cargo llvm-cov report --profile ci-coverage --lcov --output-path lcov.info --fail-uncovered-lines 3
      # On failure too: the summary lists the uncovered lines, the artifact has the full report.
      - if: always()
        run: cargo llvm-cov report --profile ci-coverage --summary-only --show-missing-lines
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  cpython:
    name: CPython ${{ matrix.python }} (symtable / sentinel / counterexamples)
    needs: changes
    if: *full-run
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: cargo build -p heki
      - name: heki_semantic vs CPython symtable
        run: python tests/symtable_verify/verify_symtable.py --heki target/debug/heki tests/symtable_verify/fixtures/ tests/corpus/
      - name: Import facts vs CPython
        run: python tests/import_verify/verify_imports.py --heki target/debug/heki tests/import_verify/fixtures/
      - name: Layer 1 knowledge base sentinels
        run: python tests/sentinel/verify_soundness_kb.py
      - name: Standard library catalog sentinels
        run: python tests/sentinel/verify_stdlib_kb.py
      - name: Container family table sentinels
        run: python tests/sentinel/verify_container_families.py
      - name: Adversarial counterexamples
        run: python tests/difftest/counterexamples.py
      - name: Counterexamples of the Soundness rewrites, end to end
        run: python tests/difftest/soundness_e2e_counterexamples.py
      - name: Counterexamples of the classes a container ABC value may be
        run: python tests/difftest/container_abc_counterexamples.py
      # Template strings and PEP 798 comprehensions: CPython 3.15 only.
      - name: Counterexamples of the shapes the IR models
        if: matrix.python == '3.15'
        run: python tests/difftest/ir_counterexamples.py
      # `sys.monitoring` is CPython 3.12 or newer. A false exact claim on the first 200 seeds
      # fails the run.
      - name: Run-time oracle (checker tests and 200 seeds)
        if: matrix.python != '3.11'
        run: |
          python tests/oracle/test_checkers.py
          python tests/oracle/run_oracle.py --heki target/debug/heki --seeds 200 --jobs 4 --time-limit 300 --out "$RUNNER_TEMP/oracle" --fail-on-refutation

  memory:
    # Shard 1 measures the peak memory; both shards run half of the generated shapes of the
    # analysis-cost gate (`--shard`), each after its own calibration.
    name: peak memory and analysis cost (${{ matrix.shard }}/2)
    needs: changes
    if: *full-run
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p heki --features count-alloc
      # `heki check` (with and without an ownership contract) and the `--watch` engine on a
      # generated project: fails when one's peak heap exceeds its budget in the script. The
      # counting build reads the same bytes on every run.
      - name: Peak heap within budget
        if: matrix.shard == 1
        run: python3 scripts/check_memory.py --heki target/release/heki
      # Generated shapes at the largest size heki models, in a function, a method, and a module
      # body: fails when one costs more than 1 s (scaled to the runner by fixed linear shapes
      # timed on a released heki from PyPI) or 1 GiB of heap beyond an empty module, or when an
      # owner's walk steps grow faster than linearly.
      - name: Analysis cost of generated shapes
        env:
          SHARD: ${{ matrix.shard }}/2
        run: python3 scripts/check_walk_shapes.py --heki target/release/heki --shard "$SHARD"
      # On every push to main, at release time (release.yml calls this workflow), and on a manual
      # run: the peak RSS of a release build, which also holds the allocator's fragmentation and
      # mappings, under a coarse budget. Main runs it so that growth shows before a release does.
      - if: matrix.shard == 1 && (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        run: cargo build --release -p heki
      - name: Peak RSS within budget
        if: matrix.shard == 1 && (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/check_memory.py --heki target/release/heki --measure rss

  release-scripts:
    # The release workflows run only on main or for a release, so their scripts are tested here,
    # on every pull request.
    name: release scripts
    if: >-
      github.event.pull_request.stack == null
      || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
          enable-cache: false
      # Python 3.12 is the runner's `python3`, which release-draft.yml runs the scripts with.
      - run: uv run --only-group scripts-tests --isolated --python 3.12 pytest scripts/tests

  pre-commit-hook:
    # `.pre-commit-hooks.yaml` as a project's configuration uses it: pre-commit builds heki from
    # this checkout and runs the hook on a project with one report, then on its configuration
    # file alone.
    name: pre-commit hook
    needs: changes
    if: *full-run
    runs-on: ubuntu-24.04
    # A cold release build, without a cache: pre-commit builds in its own directory.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # maturin builds with the cargo on PATH; the runner's own Rust can be older than heki's
      # `rust-version`.
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: The hook builds heki and checks a project
        working-directory: ${{ runner.temp }}
        # An explicit `bash` adds `-o pipefail`: a hook that fails fails the step.
        shell: bash
        env:
          HOOK_REPOSITORY: ${{ github.workspace }}
          # In GitHub Actions heki prints annotations by default; the step reads the text lines.
          HEKI_OUTPUT_FORMAT: full
        run: |
          hook() {
            uv run --project "$GITHUB_WORKSPACE" --only-group hooks --isolated pre-commit try-repo "$HOOK_REPOSITORY" heki "$@" | tee output.txt
          }
          mkdir -p project/app
          cd project
          printf '[project]\nname = "hook-check"\n' > pyproject.toml
          printf 'def concat(items):\n    out = []\n    for x in items:\n        out = out + [x]\n    return out\n' > app/slow.py
          git init --quiet
          git add .
          # A warning does not fail the hook, and the hook sets `verbose: true`, so a passing run
          # still prints it.
          hook --all-files
          grep -qF "app/slow.py:4:9: OPT101 (list-quadratic-concat) [warning]" output.txt
          # An exact error fails it.
          printf 'import time\n\n\nasync def handler() -> None:\n    time.sleep(1)\n' > app/handler.py
          git add .
          if hook --all-files; then
            echo "the hook passed on an exact EFF101 error" >&2
            exit 1
          fi
          grep -qF "app/handler.py:5:5: EFF101 (async-blocking-call) [error]" output.txt
          # The hook runs on the configuration file, which can change any report: every report
          # is shown.
          if hook --files pyproject.toml; then
            echo "the hook passed on pyproject.toml with an exact EFF101 error in the project" >&2
            exit 1
          fi
          grep -qF "app/handler.py:5:5: EFF101 (async-blocking-call) [error]" output.txt

  workflow-lint:
    name: workflow lint
    # zizmor from uv.lock, offline: it needs no token and reads only the workflow files.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
          enable-cache: false
      - run: uv run --only-group lint-workflows --isolated zizmor --offline .github/workflows

  gate:
    name: CI gate
    # The one required check: every job passed, or, in the middle of a stack or for a change of
    # CHANGELOG.md alone, every job but the always-on ones was skipped (the release scripts run
    # for every change at a full stack position).
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - architecture
      - test-build-linux
      - test-build-macos
      - test-build-windows
      - test-linux
      - test-macos
      - test-windows
      - coverage-build
      - coverage-test
      - coverage
      - cpython
      - memory
      - release-scripts
      - pre-commit-hook
      - workflow-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped as the stack position allows
        env:
          NEEDS: ${{ toJSON(needs) }}
          STACK_FULL: >-
            ${{ github.event.pull_request.stack == null
            || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
            || github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
          CODE: ${{ needs.changes.outputs.code }}
          ALWAYS_ON: changes fmt architecture workflow-lint
          STACK_ONLY: release-scripts
        shell: python
        run: |
          import json
          import os
          import sys

          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          print(json.dumps(results, sort_keys=True))
          stack_full = os.environ["STACK_FULL"] == "true"
          full = stack_full and os.environ["CODE"] == "true"
          always_on = set(os.environ["ALWAYS_ON"].split())
          stack_only = set(os.environ["STACK_ONLY"].split())

          def expected(name):
              if name in always_on:
                  return "success"
              ran = stack_full if name in stack_only else full
              return "success" if ran else "skipped"

          wrong = {name: result for name, result in results.items() if result != expected(name)}
          print("unexpected:", json.dumps(wrong, sort_keys=True))
          sys.exit(1 if wrong or not results else 0)
