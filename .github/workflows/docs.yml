name: Docs

# Builds the documentation site and checks that the generated pages (rules reference, CLI
# reference, llms.txt) match the sources, then deploys the built site to Cloudflare Pages:
# - production (project `heki`, custom domain heki.koxudaxi.dev): a published release once it
#   is on PyPI (release.yml calls this workflow after publishing), or a manual run on `main`, so
#   the site documents the released version. The production job runs in the `docs-production`
#   environment, which admits only `main` and release tags;
# - previews (the same project, branch `pr-<number>`): pull requests opened from this
#   repository by anyone but Dependabot. Both jobs use the repository secrets
#   `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`; forks and Dependabot get no secrets.
#   Without the token the preview is skipped;
# - pushes to main and pull requests from forks or Dependabot only build and check.
# The build job holds no secret; the deploy jobs check nothing out and run no code of the
# build: they upload the static site it produced.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and check
    # As in ci.yml: a pull request in the middle of a stack is covered by its bottom and top.
    if: >-
      github.event.pull_request.stack == null
      || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      # A production build (release, manual run) publishes what it builds, so it never restores
      # a cache; zizmor does not read the step condition.
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: cargo build --release -p heki
      - name: Generated pages are up to date (rules, CLI reference, experimental features)
        run: python scripts/build_docs.py --heki target/release/heki --check
      - name: llms.txt is up to date
        run: python scripts/build_llms_txt.py --check
      - name: Build the site
        run: uvx --from "zensical==0.1.2" zensical build --clean
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site

  preview:
    name: deploy preview
    needs: build
    # Dependabot is recognized by the author, not by `github.actor`: a maintainer who reopens a
    # Dependabot pull request is the actor of that run.
    if: >-
      github.repository == 'koxudaxi/heki'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    env:
      HAS_PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_PREVIEW_TOKEN != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret; the preview is not deployed."
      - if: env.HAS_PREVIEW_TOKEN == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - if: env.HAS_PREVIEW_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site --project-name=heki
            --branch=pr-${{ github.event.pull_request.number }}

  production:
    name: deploy production
    needs: build
    if: >-
      github.repository == 'koxudaxi/heki' && (
        github.event_name == 'release'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    environment:
      name: docs-production
      url: https://heki.koxudaxi.dev
    # One production deploy at a time, across releases and manual runs.
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      # A slower run for an older release must not replace the site of a newer one: a release
      # deploys only while it is the latest (a prerelease never is).
      - id: latest
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" = "$TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not the latest release ($latest); the site stays as it is."
          fi
      - if: github.event_name != 'release' || steps.latest.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - if: github.event_name != 'release' || steps.latest.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=heki --branch=main
