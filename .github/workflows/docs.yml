name: Docs

# Builds the documentation site and checks that the generated pages (rules reference, CLI
# reference, llms.txt) match the sources, then deploys the built site to Cloudflare Pages:
# - production (project `heki`, custom domain heki.koxudaxi.dev): a published release once it
#   is on PyPI (release.yml calls this workflow after publishing), or a manual run on `main`, so
#   the site documents the released version. The production job runs in the `docs-production`
#   environment, which admits only `main` and release tags;
# - previews (the same project, branch `pr-<number>`): pull requests opened from this
#   repository by anyone but Dependabot. Both jobs use the repository secrets
#   `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`; forks and Dependabot get no secrets.
#   Without the token the preview is skipped;
# - pushes to main and pull requests from forks or Dependabot only build and check.
# The build job holds no secret; the deploy jobs check nothing out and run no code of the
# build: they upload the static site it produced. A production build compiles nothing: it
# deploys pages the pull request and the push to main checked.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  build:
    name: build and check
    # As in ci.yml: a pull request in the middle of a stack is covered by its bottom and top.
    if: >-
      github.event.pull_request.stack == null
      || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    env:
      # A production deploy (a release, or a manual run on main) publishes a commit whose pages
      # the pull request and the push to main already checked (a release tag is a commit of
      # main), so it builds no heki and checks nothing: it rewrites the release's pins and builds
      # the site.
      PRODUCTION: >-
        ${{ github.event_name == 'release'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `build_docs.py --check` runs a `heki` built from the same code, which a push to main
      # caches: a documentation pull request restores it and builds nothing. The key hashes every
      # file the build reads (the crates, the catalogs and the files they embed, the manifests)
      # and this workflow (the toolchain pin and the profile); `test_ci_workflow.py` checks that
      # it covers what the crates embed and no page but CHANGELOG.md, which `heki version`
      # embeds. Only pushes to main save it, and this job holds no secret.
      - id: heki
        if: env.PRODUCTION != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci/heki
          key: >-
            heki-ci-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**',
            'kb/**', 'skills/**', 'tests/**', 'CHANGELOG.md', 'pyproject.toml',
            '.github/workflows/docs.yml') }}
      - if: env.PRODUCTION != 'true' && steps.heki.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      # The dependencies of a build that misses the cache, in the `ci` profile (`key`: the
      # job's cache of release builds holds none). zizmor does not read the step condition, and
      # a production run never gets here.
      - if: env.PRODUCTION != 'true' && steps.heki.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        with:
          key: ci-profile
          save-if: ${{ github.event_name == 'push' }}
      # The `ci` profile (see Cargo.toml) optimizes the workspace crates less than a release
      # build, which the pages do not depend on.
      - if: env.PRODUCTION != 'true' && steps.heki.outputs.cache-hit != 'true'
        run: cargo build --locked --profile ci -p heki
      - if: github.event_name == 'push' && steps.heki.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci/heki
          key: ${{ steps.heki.outputs.cache-primary-key }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
          enable-cache: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # A release deploys docs that pin its own version (the pre-commit `rev:` lines and the
      # `heki==` of the commands), written the way the build jobs of release.yml write the
      # version: the tagged tree still shows the previous release until the Release Sync pull
      # request merges.
      - name: Write the release into the manifests and the pages' pins
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG#v}"
          if [ -z "$version" ]; then
            echo "::error::The release tag \`$TAG\` names no version."
            exit 1
          fi
          date=""
          if [ "$PRERELEASE" != true ]; then
            date="${PUBLISHED_AT:0:10}"
          fi
          python scripts/set_release_versions.py "$version" ${date:+--changelog "$date"}
      # llms-full.txt copies the adoption page, as the Release Sync pull request regenerates it.
      - name: Regenerate llms.txt from the release's pages
        if: github.event_name == 'release'
        run: python scripts/build_llms_txt.py
      - name: Generated pages are up to date (rules, CLI reference, experimental features)
        if: env.PRODUCTION != 'true'
        run: python scripts/build_docs.py --heki target/ci/heki --check
      - name: llms.txt is up to date
        if: env.PRODUCTION != 'true'
        run: python scripts/build_llms_txt.py --check
      - name: Build the site
        run: uv run --only-group docs --isolated zensical build --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site

  preview:
    name: deploy preview
    needs: build
    # Dependabot is recognized by the author, not by `github.actor`: a maintainer who reopens a
    # Dependabot pull request is the actor of that run.
    if: >-
      github.repository == 'koxudaxi/heki'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    env:
      HAS_PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_PREVIEW_TOKEN != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret; the preview is not deployed."
      - if: env.HAS_PREVIEW_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - if: env.HAS_PREVIEW_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site --project-name=heki
            --branch=pr-${{ github.event.pull_request.number }}

  production:
    name: deploy production
    needs: build
    if: >-
      github.repository == 'koxudaxi/heki' && (
        github.event_name == 'release'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    environment:
      name: docs-production
      url: https://heki.koxudaxi.dev
    # One production deploy at a time, across releases and manual runs.
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      # A slower run for an older release must not replace the site of a newer one: a release
      # deploys only while it is the latest (a prerelease never is).
      - id: latest
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" = "$TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not the latest release ($latest); the site stays as it is."
          fi
      - if: github.event_name != 'release' || steps.latest.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - if: github.event_name != 'release' || steps.latest.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=heki --branch=main
