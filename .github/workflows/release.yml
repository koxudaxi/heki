name: Release

# Publishes a GitHub release: maturin wheels (`bindings = "bin"`: the wheel ships the `heki`
# executable) for every platform, the source distribution, PyPI through trusted publishing, and
# optionally the crates on crates.io. Its jobs restore no cache (`enable-cache: false` for uv):
# what they build or check is published.
#
# The tag is the version (`v` + the version): every job that builds from the checkout first writes
# it into the manifests and `Cargo.lock` (`scripts/set_release_versions.py`), and the checks
# compare the distributions with it. Nothing is committed here; after the release, the Release
# Sync workflow opens the pull request that brings `main` to it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI from main (otherwise only build and check the distributions)"
        type: boolean
        default: false
      version:
        description: "Build and check this version (for example 0.1.2) without publishing; empty keeps the committed manifests' version"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  version:
    # The version the builds write and the checks expect: the release tag without its `v`, the
    # `version` input of a manual run, or empty to keep the committed manifests' version. Only a
    # release tag publishes a version the manifests do not declare.
    name: release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "$INPUT" ] && [ "$PUBLISH" = true ]; then
            echo "::error::The version input builds and checks only: publish a release to publish a version."
            exit 1
          fi
          version="${TAG:-$INPUT}"
          version="${version#v}"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ -z "$version" ]; then
            echo "::error::The release tag \`$TAG\` names no version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheels:
    name: wheel (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: "2_28"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: "2_28"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            manylinux: musllinux_1_2
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Write the release version into the manifests
        if: env.RELEASE_VERSION != ''
        shell: bash
        run: uv run --no-project --python 3.14 scripts/set_release_versions.py "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          targets: ${{ matrix.target }}
      # The ruff crates come from a git tag (ADR-009 / ADR-016), and the ruff repository holds
      # test snapshots whose paths pass Windows' 260-character limit once cargo checks them out.
      - name: Allow long paths in git checkouts
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # The Linux builds run in a container, which installs its own toolchain (`stable`
          # unless told otherwise) instead of the one set up above.
          rust-toolchain: 1.99.0
          args: --release --locked --out dist
      - name: Check metadata
        shell: bash
        run: uv run --only-group release --isolated twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*

  sdist:
    name: source distribution
    needs: version
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Write the release version into the manifests
        if: env.RELEASE_VERSION != ''
        run: uv run --no-project --python 3.14 scripts/set_release_versions.py "$RELEASE_VERSION"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - run: uv run --only-group release --isolated twine check dist/*
      # ci.yml's Linux tests are built and run from the unpacked source distribution (`build
      # tests` and its `test` shards), which the `ci` job below runs on the release commit.
      - name: heki builds and runs from the source distribution
        run: |
          uv venv .sdist-smoke
          # `--no-config`: pyproject.toml's `no-build` is for the locked tools; this builds heki.
          uv pip install --no-config --python .sdist-smoke dist/*.tar.gz
          .sdist-smoke/bin/heki --version
          .sdist-smoke/bin/heki rule --all > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*

  smoke:
    # Every wheel must carry the executable, and the executable must report a known diagnostic
    # (exit 1) and pass a clean project (exit 0). Each wheel is installed on a runner of its
    # platform; the static musl binary runs, extracted from its wheel, on a glibc runner.
    name: wheel smoke test (${{ matrix.target }})
    needs: [version, wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            install: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            install: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            install: false
          - target: aarch64-apple-darwin
            runner: macos-15
            install: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            install: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            install: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: heki runs from the wheel
        shell: bash
        env:
          INSTALL: ${{ matrix.install }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$INSTALL" = true ]; then set -- --install; fi
          if [ -n "$RELEASE_VERSION" ]; then set -- "$@" --version "$RELEASE_VERSION"; fi
          python scripts/release_check.py smoke dist/*.whl "$@"

  versions:
    # Every distribution declares the version the builds wrote: a tag such as `v0.2.0-rc.1` must
    # not publish distributions that declare `0.2.0`.
    name: versions match the tag
    needs: [version, wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Every distribution declares the release version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then set -- --version "$RELEASE_VERSION"; fi
          uv run --only-group release --isolated python scripts/release_check.py versions dist "$@"

  ci:
    # The correctness gates (tests, LSP oracle, rewrite differential tests, CPython checks) on
    # the exact commit being published: CI on pull requests and on main does not cover a tag.
    name: CI
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] the workflow files of the commit being released
    permissions:
      contents: read

  pypi:
    # A partial upload is resumed with "Re-run failed jobs": the rerun uploads this run's
    # artifacts again, and PyPI accepts a file it already holds when the contents are the same.
    # "Re-run all jobs" rebuilds the distributions, and PyPI refuses changed files under a name
    # it already has.
    name: publish to PyPI
    # The `pypi` environment, which PyPI's trusted publisher names, admits only main and release
    # tags as well.
    if: github.event_name == 'release' || (inputs.publish && github.ref == 'refs/heads/main')
    needs: [ci, wheels, sdist, smoke, versions]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/heki/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docs:
    # The production site documents a release once its distributions are on PyPI.
    name: production docs
    needs: [pypi]
    if: github.event_name == 'release'
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository] the workflow files of the commit being released
    # A called workflow sees no secret unless the caller passes them: the deploy job needs
    # the two Cloudflare secrets.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read

  crates-io:
    # Off until the repository variable `PUBLISH_CRATES` is `true`, which needs two changes
    # first: the parser crates come from a pinned ruff git tag (ADR-009 / ADR-016), which
    # crates.io does not accept as a dependency, so they must be published or vendored; and
    # `heki_kb` embeds `kb/` from the repository root, outside its crate archive, so the
    # catalogs must move into the crate. `cargo publish --workspace` packages and verifies
    # every crate before it uploads the first one.
    name: publish to crates.io
    if: github.event_name == 'release' && vars.PUBLISH_CRATES == 'true'
    needs: [version, pypi]
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/heki
    permissions:
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Write the release version into the manifests
        if: env.RELEASE_VERSION != ''
        run: uv run --no-project --python 3.14 scripts/set_release_versions.py "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      # Trusted publishing: a short-lived token from the repository's OIDC identity.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # `--allow-dirty`: the version written above is the only change to the checkout.
      - name: Publish every crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --allow-dirty --workspace
