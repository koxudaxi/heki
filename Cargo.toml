[workspace]
members = [
    "crates/heki",
    "crates/heki_ast",
    "crates/heki_env",
    "crates/heki_semantic",
    "crates/heki_ir",
    "crates/heki_kb",
    "crates/heki_soundness",
    "crates/heki_effect",
    "crates/heki_rules",
    "crates/heki_profile",
    "crates/heki_diagnostics",
    "crates/heki_lsp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/koxudaxi/heki"
homepage = "https://github.com/koxudaxi/heki"
description = "Effect & Alias semantic checker for Python — the 3rd static analysis layer alongside Ruff and ty"

[workspace.dependencies]
# Internal crates
heki_ast = { path = "crates/heki_ast" }
heki_env = { path = "crates/heki_env" }
heki_semantic = { path = "crates/heki_semantic" }
heki_ir = { path = "crates/heki_ir" }
heki_kb = { path = "crates/heki_kb" }
heki_soundness = { path = "crates/heki_soundness" }
heki_effect = { path = "crates/heki_effect" }
heki_rules = { path = "crates/heki_rules" }
heki_profile = { path = "crates/heki_profile" }
heki_diagnostics = { path = "crates/heki_diagnostics" }
heki_lsp = { path = "crates/heki_lsp" }

# Frontend parser (STRICTLY isolated to heki_ast per ADR-009 / ADR-016)
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }

# Core utilities
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
thiserror = "2.0"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
