[workspace]
members = [
    "crates/heki",
    "crates/heki_ast",
    "crates/heki_env",
    "crates/heki_semantic",
    "crates/heki_ir",
    "crates/heki_kb",
    "crates/heki_soundness",
    "crates/heki_effect",
    "crates/heki_rules",
    "crates/heki_profile",
    "crates/heki_diagnostics",
    "crates/heki_lsp",
]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/koxudaxi/heki"
homepage = "https://github.com/koxudaxi/heki"
description = "Experimental static checker for Python that tracks side effects and mutations across function calls"

[workspace.dependencies]
# Internal crates (crates.io needs a version next to each path; it must equal
# `workspace.package.version`, which the release workflow checks)
heki_ast = { path = "crates/heki_ast", version = "0.2.3" }
heki_env = { path = "crates/heki_env", version = "0.2.3" }
heki_semantic = { path = "crates/heki_semantic", version = "0.2.3" }
heki_ir = { path = "crates/heki_ir", version = "0.2.3" }
heki_kb = { path = "crates/heki_kb", version = "0.2.3" }
heki_soundness = { path = "crates/heki_soundness", version = "0.2.3" }
heki_effect = { path = "crates/heki_effect", version = "0.2.3" }
heki_rules = { path = "crates/heki_rules", version = "0.2.3" }
heki_profile = { path = "crates/heki_profile", version = "0.2.3" }
heki_diagnostics = { path = "crates/heki_diagnostics", version = "0.2.3" }
heki_lsp = { path = "crates/heki_lsp", version = "0.2.3" }

# Frontend parser (STRICTLY isolated to heki_ast per ADR-009 / ADR-016)
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }

# Core utilities
# The colors of the text output, in the styles of Ruff's renderer (clap already builds this crate
# and the next one).
anstyle = "1.0"
# Turns on escape codes in a Windows console, which needs `unsafe`, forbidden in heki's crates.
anstyle-query = "1.1"
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
rustc-hash = "2.1"
# The JSON Schema of `heki recommend`'s JSON object, derived from the types that write it.
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = "1.13"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
toml = "0.8"
tower-lsp = "0.20"
# The `file:` URIs of the end-to-end LSP tests (the version `tower-lsp` uses).
url = "2.5"
# The architecture test that finds walks written outside `heki_ir::walk` parses the sources.
proc-macro2 = { version = "1.0", default-features = false }
syn = { version = "3.0", default-features = false, features = ["clone-impls", "full", "parsing", "visit"] }
tower-service = "0.3"
# The memory gate's counting allocator (`heki`'s `count-alloc` feature, never in a release).
cap = { version = "0.1.2", features = ["stats"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# The test and coverage builds of CI (`--cargo-profile ci`): the workspace crates as in `dev`, the
# dependencies optimized. The end-to-end tests run the real binary thousands of times, and the
# optimized dependencies (the parser among them) make those runs about 1.6 times as fast; CI
# caches them. Optimizing the workspace crates as well would speed the runs up 1.7 times more but
# triple their compile time, which CI pays on every run. Coverage measures only the workspace
# crates, so its report has the lines of `dev`. Line tables keep the backtraces readable.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 3
