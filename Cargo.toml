[workspace]
members = [
    "crates/heki",
    "crates/heki_ast",
    "crates/heki_env",
    "crates/heki_semantic",
    "crates/heki_ir",
    "crates/heki_kb",
    "crates/heki_soundness",
    "crates/heki_effect",
    "crates/heki_rules",
    "crates/heki_diagnostics",
    "crates/heki_lsp",
]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/koxudaxi/heki"
homepage = "https://github.com/koxudaxi/heki"
description = "Static checker for Python that tracks side effects and mutations across function calls"

[workspace.dependencies]
# Internal crates (crates.io needs a version next to each path; it must equal
# `workspace.package.version`, which the release workflow checks)
heki_ast = { path = "crates/heki_ast", version = "0.11.0" }
heki_env = { path = "crates/heki_env", version = "0.11.0" }
heki_semantic = { path = "crates/heki_semantic", version = "0.11.0" }
heki_ir = { path = "crates/heki_ir", version = "0.11.0" }
heki_kb = { path = "crates/heki_kb", version = "0.11.0" }
heki_soundness = { path = "crates/heki_soundness", version = "0.11.0" }
heki_effect = { path = "crates/heki_effect", version = "0.11.0" }
heki_rules = { path = "crates/heki_rules", version = "0.11.0" }
heki_diagnostics = { path = "crates/heki_diagnostics", version = "0.11.0" }
heki_lsp = { path = "crates/heki_lsp", version = "0.11.0" }

# Frontend parser (STRICTLY isolated to heki_ast per ADR-009 / ADR-016)
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }

# Core utilities
# The colors of the text output, in the styles of Ruff's renderer (clap already builds this crate
# and the next one).
anstyle = "1.0"
# Turns on escape codes in a Windows console, which needs `unsafe`, forbidden in heki's crates.
anstyle-query = "1.1"
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
rustc-hash = "2.1"
# The JSON Schema of `heki recommend`'s JSON object, derived from the types that write it.
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = "1.13"
# The names an error offers for a misspelled one, as similar as clap requires (clap already builds
# this crate).
strsim = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
toml = "1.2"
# The positions of the keys and values of a configuration file, for its errors (`toml` already
# builds this crate).
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
tower-lsp = "0.20"
# The `file:` URIs of the end-to-end LSP tests (the version `tower-lsp` uses).
url = "2.5"
# The architecture test that finds walks written outside `heki_ir::walk` parses the sources.
proc-macro2 = { version = "1.0", default-features = false }
syn = { version = "3.0", default-features = false, features = ["clone-impls", "full", "parsing", "visit"] }
tower-service = "0.3"
# The memory gate's counting allocator (`heki`'s `count-alloc` feature, never in a release).
cap = { version = "0.1.2", features = ["stats"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# The test builds of CI (`--cargo-profile ci`): `dev` with the workspace crates
# optimized at level 1 and the dependencies at 3. The end-to-end and language-server tests run the real binary
# thousands of times, and the slowest of them run 3.7 times as fast as in `dev`; level 2 gains
# only 5 % more for a build that is 15 % slower. Line tables keep the backtraces readable.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 3

# The coverage build of CI (`--cargo-profile ci-coverage`): the workspace crates as in `dev`, the
# dependencies optimized. Coverage measures only the workspace crates; optimizing them changes
# which lines the report leaves uncovered (inlined code), so the report has the lines of `dev`.
[profile.ci-coverage]
inherits = "dev"
debug = "line-tables-only"

[profile.ci-coverage.package."*"]
opt-level = 3
