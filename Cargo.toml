[workspace]
members = [
    "crates/heki",
    "crates/heki_ast",
    "crates/heki_env",
    "crates/heki_semantic",
    "crates/heki_ir",
    "crates/heki_kb",
    "crates/heki_soundness",
    "crates/heki_effect",
    "crates/heki_rules",
    "crates/heki_profile",
    "crates/heki_diagnostics",
    "crates/heki_lsp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/koxudaxi/heki"
homepage = "https://github.com/koxudaxi/heki"
description = "Experimental static checker for Python that tracks side effects and mutations across function calls"

[workspace.dependencies]
# Internal crates (crates.io needs a version next to each path; it must equal
# `workspace.package.version`, which the release workflow checks)
heki_ast = { path = "crates/heki_ast", version = "0.1.0" }
heki_env = { path = "crates/heki_env", version = "0.1.0" }
heki_semantic = { path = "crates/heki_semantic", version = "0.1.0" }
heki_ir = { path = "crates/heki_ir", version = "0.1.0" }
heki_kb = { path = "crates/heki_kb", version = "0.1.0" }
heki_soundness = { path = "crates/heki_soundness", version = "0.1.0" }
heki_effect = { path = "crates/heki_effect", version = "0.1.0" }
heki_rules = { path = "crates/heki_rules", version = "0.1.0" }
heki_profile = { path = "crates/heki_profile", version = "0.1.0" }
heki_diagnostics = { path = "crates/heki_diagnostics", version = "0.1.0" }
heki_lsp = { path = "crates/heki_lsp", version = "0.1.0" }

# Frontend parser (STRICTLY isolated to heki_ast per ADR-009 / ADR-016)
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }

# Core utilities
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = "1.13"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
toml = "0.8"
tower-lsp = "0.20"
tower-service = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
