<text y="89" xml:space="preserve"><tspan x="18" textLength="90" class="b">app/api.py</tspan><tspan x="108" textLength="9" class="f6">:</tspan><tspan x="117" textLength="9">5</tspan><tspan x="126" textLength="9" class="f6">:</tspan><tspan x="135" textLength="18">12</tspan><tspan x="153" textLength="9" class="f6">:</tspan><tspan x="171" textLength="54" class="b f1">EFF101</tspan><tspan x="225" textLength="216"> (async-blocking-call) [</tspan><tspan x="441" textLength="45" class="b f9">error</tspan><tspan x="486" textLength="423">] `app.users.load_user` always runs the waiting</tspan></text>
