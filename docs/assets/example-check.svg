<text y="215" xml:space="preserve"><tspan x="36" textLength="9" class="b f12">=</tspan><tspan x="54" textLength="63" class="b f12">related</tspan><tspan x="117" textLength="18">: </tspan><tspan x="135" textLength="108" class="b">app/users.py</tspan><tspan x="243" textLength="9" class="f6">:</tspan><tspan x="252" textLength="18">10</tspan><tspan x="270" textLength="9" class="f6">:</tspan><tspan x="279" textLength="18">41</tspan><tspan x="297" textLength="9" class="f6">:</tspan><tspan x="306" textLength="369"> `load_user` calls `app.users.fetch_name`</tspan></text>
<text y="236" xml:space="preserve"><tspan x="36" textLength="9" class="b f12">=</tspan><tspan x="54" textLength="63" class="b f12">related</tspan><tspan x="117" textLength="18">: </tspan><tspan x="135" textLength="108" class="b">app/users.py</tspan><tspan x="243" textLength="9" class="f6">:</tspan><tspan x="252" textLength="9">6</tspan><tspan x="261" textLength="9" class="f6">:</tspan><tspan x="270" textLength="18">12</tspan><tspan x="288" textLength="9" class="f6">:</tspan><tspan x="297" textLength="306"> `fetch_name` calls `requests.get`</tspan></text>
