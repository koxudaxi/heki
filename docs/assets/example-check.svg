<text y="236" xml:space="preserve"><tspan x="18" textLength="135" class="b">app/checkout.py</tspan><tspan x="153" textLength="9" class="f6">:</tspan><tspan x="162" textLength="9">7</tspan><tspan x="171" textLength="9" class="f6">:</tspan><tspan x="180" textLength="9">5</tspan><tspan x="189" textLength="9" class="f6">:</tspan><tspan x="207" textLength="54" class="b f1">MUT201</tspan><tspan x="261" textLength="234"> (write-owner-violation) [</tspan><tspan x="495" textLength="45" class="b f9">error</tspan><tspan x="540" textLength="315">, heuristic] `add_gift_wrap` writes</tspan></text>
