<text y="89" xml:space="preserve"><tspan x="18" textLength="90" class="b">app/api.py</tspan><tspan x="108" textLength="9" class="f6">:</tspan><tspan x="117" textLength="9">7</tspan><tspan x="126" textLength="9" class="f6">:</tspan><tspan x="135" textLength="9">5</tspan><tspan x="144" textLength="9" class="f6">:</tspan><tspan x="162" textLength="54" class="b f1">MUT114</tspan><tspan x="216" textLength="243"> (cached-result-mutation) [</tspan><tspan x="459" textLength="45" class="b f9">error</tspan><tspan x="504" textLength="405">] `request_headers` changes in place the dict</tspan></text>
