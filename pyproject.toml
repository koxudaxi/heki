[build-system]
requires = ["maturin>=1.12.6,<2.0"]
build-backend = "maturin"

[project]
name = "heki"
version = "0.5.0"
description = "Experimental static checker for Python that tracks side effects and mutations across function calls"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["linter", "static-analysis", "effect-analysis", "alias-analysis", "python", "rust"]

[project.urls]
Homepage = "https://github.com/koxudaxi/heki"
Documentation = "https://heki.koxudaxi.dev"
Repository = "https://github.com/koxudaxi/heki"
Issues = "https://github.com/koxudaxi/heki/issues"
Changelog = "https://github.com/koxudaxi/heki/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/heki/Cargo.toml"
module-name = "heki"
# Files at the repository root that the source distribution must carry: `heki_kb` embeds the
# catalogs with `include_str!`, and `cargo test --workspace` embeds or reads the test inputs:
# `docs/index.md`, whose examples must equal README.md's, the pages, changelog, and generator
# scripts the documentation checks run on, and the Agent Skill with its Claude Code marketplace,
# which a test checks against the binary and the pages it links (`docs/llms.txt` among them). CI
# builds and runs the Linux tests in the unpacked archive, so a file missing here fails a pull
# request, not a release. The wheel does not carry CHANGELOG.md: maturin would install it as
# `site-packages/CHANGELOG.md`. The binary embeds its release's section (`heki version
# --changelog`), and the metadata links the changelog.
include = [
    { path = "kb/**/*.toml", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "docs/llms.txt", format = "sdist" },
    { path = "scripts/build_docs.py", format = "sdist" },
    { path = "scripts/ansi_svg.py", format = "sdist" },
    { path = "scripts/set_release_versions.py", format = "sdist" },
    { path = "zensical.toml", format = "sdist" },
    { path = "ARCHITECTURE.md", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "skills/**/*", format = "sdist" },
    { path = ".claude-plugin/*", format = "sdist" },
]

# The tools CI and the documentation run, locked in uv.lock. A workflow runs one group with
# `uv run --only-group <group> --isolated <tool>`, which installs no heki build.
[dependency-groups]
scripts-tests = ["pytest==9.2.0", "pyyaml==6.0.4", "jsonschema==4.26.0"]
sentinel = ["packaging==26.3"]
docs = ["zensical==0.1.2"]
release = ["twine", "packaging==26.3"]
hooks = ["pre-commit==4.7.0"]
lint-workflows = ["zizmor"]

[tool.uv]
# A release younger than three days is not locked: a compromised upload is usually pulled
# within hours.
exclude-newer = "3d"
# Every locked tool installs from a wheel; heki's own sdist is built only by the release workflow.
no-build = true
# Nothing is installed from the project itself.
package = false

[tool.uv.dependency-groups]
scripts-tests = { requires-python = ">=3.12" }
sentinel = { requires-python = ">=3.12" }
docs = { requires-python = ">=3.12" }
release = { requires-python = ">=3.12" }
hooks = { requires-python = ">=3.12" }
lint-workflows = { requires-python = ">=3.12" }
