[build-system]
requires = ["maturin>=1.12.6,<2.0"]
build-backend = "maturin"

[project]
name = "heki"
version = "0.1.0"
description = "Effect & Alias semantic checker for Python — the 3rd static analysis layer alongside Ruff and ty"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["linter", "static-analysis", "effect-analysis", "alias-analysis", "python", "rust"]

[project.urls]
Homepage = "https://github.com/koxudaxi/heki"
Documentation = "https://heki.koxudaxi.dev"
Repository = "https://github.com/koxudaxi/heki"
Issues = "https://github.com/koxudaxi/heki/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/heki/Cargo.toml"
module-name = "heki"
